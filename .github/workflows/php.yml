name: PHP Lint

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none

      - name: Lint PHP files (syntax)
        run: |
          set -e
          fail=0
          while IFS= read -r -d '' f; do
            if ! php -l "$f" > /dev/null; then
              echo "FAIL: $f"
              fail=1
            fi
          done < <(find donation/app/public/acfe-z5xyst3ouh gestion-candidatures -type f -name "*.php" -print0)
          if [ "$fail" -ne 0 ]; then
            echo "PHP syntax errors found"
            exit 1
          fi
          echo "All PHP files OK"
